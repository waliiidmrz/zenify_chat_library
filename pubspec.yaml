name: zenify_chat
description: "A Flutter package for Matrix chat integration."
version: 0.0.2
homepage: "https://github.com/waliiidmrz/zenify_chat"

environment:
  sdk: ^3.6.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  matrix: ^0.38.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  file_picker: ^10.1.9
  mime: ^2.0.0
  transparent_image: ^2.0.1
  open_filex: ^4.7.0
  path_provider: ^2.1.5
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.3  
  build_runner: ^2.4.8   

flutter:
  uses-material-design: true

   
