name: zenify_chat
description: "A Flutter package for Matrix chat integration."
version: 0.0.2
homepage: "https://github.com/waliiidmrz/zenify_chat"

environment:
  sdk: ^3.6.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  matrix: ^0.38.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  hive_flutter: ^1.1.0
  intl: ^0.20.2

  # ✅ Required for `flutter_secure_storage` plugin
  flutter_secure_storage_web: ^1.1.1  # For web
  flutter_secure_storage_macos: ^3.1.3  # For macOS
  flutter_secure_storage_windows: ^3.1.2  # For Windows
  flutter_secure_storage_linux: ^1.1.0  # For Linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.3  # ✅ Added for testing
  build_runner: ^2.4.8  # ✅ Required for mockito

flutter:
  uses-material-design: true

  # ✅ Optional: Define assets here if needed
  # assets:
  #   - assets/icons/chat.png
